{% extends "base.html" %}

{% block title %}Blog{% endblock %}

{% block content %}

<h2>Blog Posts</h2>

{% for post in posts %}

<div class="card mb-3">

<div class="card-body">

<h3>
<a href="{% url 'portfolio:post_detail' post.slug %}">
{{ post.title }}
</a>
</h3>

<p>{{ post.content|truncatewords:30 }}</p>

</div>

</div>

{% empty %}

<p>No posts available.</p>

{% endfor %}

{% endblock %}
